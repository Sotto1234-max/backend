<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>1v1 Video Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.1/dist/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.3.1/dist/peerjs.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    video {
      width: 100%;
      max-width: 400px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-100 to-purple-100 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-md flex flex-col items-center">
    <h1 class="text-3xl font-extrabold text-indigo-600 mb-2">🎥 1v1 Video Chat</h1>
    <p id="status" class="text-sm font-medium text-gray-700 mb-4">🔄 Waiting...</p>

    <div class="flex flex-col items-center space-y-3 mb-4 w-full">
      <video id="local-video" autoplay muted class="border"></video>
      <video id="remote-video" autoplay class="border"></video>
    </div>

    <div class="flex flex-col gap-2 w-full">
      <button id="startBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded w-full font-semibold" onclick="startCall()">Start</button>
      <button id="nextBtn" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded w-full font-semibold hidden" onclick="nextCall()">Next</button>
      <button id="stopBtn" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded w-full font-semibold hidden" onclick="stopCall()">Stop</button>
    </div>
  </div>

  <script>
    const socket = io();
    const startBtn = document.getElementById('startBtn');
    const nextBtn = document.getElementById('nextBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusText = document.getElementById('status');
    const localVideo = document.getElementById('local-video');
    const remoteVideo = document.getElementById('remote-video');

    let localStream;
    let peer;
    let currentCall = null;

    async function getLocalStream() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;
      } catch (error) {
        alert("Camera/Microphone permission denied.");
      }
    }

    async function startCall() {
      startBtn.classList.add('hidden');
      nextBtn.classList.remove('hidden');
      stopBtn.classList.remove('hidden');
      statusText.textContent = "🔍 Searching for a partner...";

      peer = new Peer(undefined, {
        host: backendnode-index-js.onrender.com,
        port: 443,
        path: '/peerjs',
        secure: true,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', (id) => {
        socket.emit('join', id);

        socket.on('match', (otherPeerId) => {
          statusText.textContent = "🔗 Connected!";
          const call = peer.call(otherPeerId, localStream); // media পাঠানো হচ্ছে
          call.on('stream', (remoteStream) => {
            remoteVideo.srcObject = remoteStream; // remote stream বসানো
          });
          currentCall = call;
        });
      });

      peer.on('call', (call) => {
        call.answer(localStream); // caller এর call receive করে উত্তর দিচ্ছে
        call.on('stream', (remoteStream) => {
          remoteVideo.srcObject = remoteStream;
        });
        currentCall = call;
        statusText.textContent = "🔗 Connected!";
      });

      peer.on('disconnected', () => {
        statusText.textContent = "❌ Peer disconnected.";
      });
    }

    function nextCall() {
      socket.emit('leave');
      resetCall();
      startCall(); // আবার নতুন করে শুরু কর
    }

    function stopCall() {
      socket.emit('leave');
      resetCall();
    }

    function resetCall() {
      if (currentCall) {
        currentCall.close();
        currentCall = null;
      }
      if (peer) {
        peer.destroy();
        peer = null;
      }
      remoteVideo.srcObject = null;
      startBtn.classList.remove('hidden');
      nextBtn.classList.add('hidden');
      stopBtn.classList.add('hidden');
      statusText.textContent = "❌ Disconnected.";
      setTimeout(() => {
        statusText.textContent = "🔄 Waiting...";
      }, 1500);
    }

    window.onload = async () => {
      await getLocalStream(); // আগে local video/audio stream নেওয়া
    };
  </script>
</body>
</html>
