<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>1v1 Video Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.1/dist/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.3.1/dist/peerjs.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    video {
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 to-purple-600 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center">
    <h1 class="text-3xl font-extrabold text-indigo-600 mb-6">🎥 1v1 Video Chat</h1>
    <div id="video-container" class="space-y-4">
      <video id="local-video" autoplay muted class="w-full h-auto"></video>
      <video id="remote-video" autoplay class="w-full h-auto"></video>
    </div>
    <div class="mt-6 flex justify-center space-x-3">
      <button id="startBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-full" onclick="startCall()">Start</button>
      <button id="nextBtn" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-full hidden" onclick="nextCall()">Next</button>
      <button id="stopBtn" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-full hidden" onclick="stopCall()">Stop</button>
    </div>
  </div>

  <script>
    const socket = io();
    const startBtn = document.getElementById('startBtn');
    const nextBtn = document.getElementById('nextBtn');
    const stopBtn = document.getElementById('stopBtn');
    const localVideo = document.getElementById('local-video');
    const remoteVideo = document.getElementById('remote-video');

    let localStream;
    let peer;
    let currentCall = null;

    async function getLocalStream() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;
      } catch (error) {
        alert("Camera & microphone access is required.");
        console.error("Webcam error: ", error);
      }
    }

    async function startCall() {
      startBtn.classList.add('hidden');
      nextBtn.classList.remove('hidden');
      stopBtn.classList.remove('hidden');

      peer = new Peer();

      peer.on('open', (id) => {
        socket.emit('ready', id);
      });

      peer.on('call', (call) => {
        call.answer(localStream);
        call.on('stream', (remoteStream) => {
          remoteVideo.srcObject = remoteStream;
        });
        currentCall = call;
      });

      socket.on('peerId', (peerId) => {
        const call = peer.call(peerId, localStream);
        call.on('stream', (remoteStream) => {
          remoteVideo.srcObject = remoteStream;
        });
        currentCall = call;
      });
    }

    function stopCall() {
      socket.emit('leave');
      resetCall();
    }

    function nextCall() {
      socket.emit('leave');
      resetCall();
      startCall();
    }

    function resetCall() {
      if (currentCall) {
        currentCall.close();
        currentCall = null;
      }
      if (peer) {
        peer.destroy();
        peer = null;
      }
      remoteVideo.srcObject = null;
      startBtn.classList.remove('hidden');
      nextBtn.classList.add('hidden');
      stopBtn.classList.add('hidden');
    }

    window.onload = () => {
      getLocalStream();
    };
  </script>
</body>
</html>
